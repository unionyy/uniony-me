<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAKE</title>
  <style>
    :root { --bg: #0f1220; --fg: #e6e8ef; --accent: #7aa2f7; --danger:#ff6b6b; }
    html, body { height: 100%; }
    body { margin: 0; background: radial-gradient(1200px 800px at 70% -10%, #202540, var(--bg)); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; display: grid; place-items: center; }
    .wrap { display: grid; gap: 14px; }
    h1 { font-size: 20px; margin: 0; text-align: center; font-weight: 700; letter-spacing: .2px; }
    .hud { text-align: center; opacity:.9; font-size: 14px; }
    canvas { background: #0b0e1a; border: 1px solid #2a2f4a; box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.03); border-radius: 12px; image-rendering: pixelated; }
    .pill { display:inline-block; padding: 4px 10px; border: 1px solid #3a4064; border-radius: 999px; font-size: 12px; margin: 0 4px; }
    .accent { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, #000); }
    .danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 40%, #000); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SNAKE (좌/우 화살표로 회전)</h1>
    <canvas id="game" width="480" height="480" aria-label="snake game" role="img"></canvas>
    <div class="hud">
      <span class="pill">좌/우: 회전</span>
      <span class="pill">Space: 일시정지/시작</span>
      <span class="pill">R: 리셋</span>
      <span class="pill accent">점수: <b id="score">0</b></span>
    </div>
  </div>
  <script src="https://grggames.com/grg-games-sdk.min.js"></script>
  <script>
  // === 기본 설정 ===
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CELL = 24;                // 한 칸 픽셀 크기
  const COLS = Math.floor(W / CELL);
  const ROWS = Math.floor(H / CELL);

  const SPEEDS = { slow: 160, mid: 120, fast: 90 };
  let tickMs = SPEEDS.mid;        // 기본 속도

  // === 게임 상태 ===
  let snake, dir, nextTurn, food, grown, playing, timer, score, isOver;

  function reset() {
    // 초기 위치 (가운데)
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [ {x: cx-2, y: cy}, {x: cx-1, y: cy}, {x: cx, y: cy} ];
    // 진행 방향: 오른쪽 (단위 벡터)
    dir = {x: 1, y: 0};
    nextTurn = 0; // -1: 좌회전, +1: 우회전
    placeFood();
    grown = 0;
    score = 0;
    document.getElementById('score').textContent = score;
    playing = false;
    isOver = false;
    clearInterval(timer);
    draw();
  }

  // === 입력 처리: 좌/우 화살표로 회전 ===
  addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') { nextTurn = 1; }
    else if (e.code === 'ArrowRight') { nextTurn = -1; }
    else if (e.code === 'Space') { toggle(); }
    else if (e.code === 'KeyR') { reset(); }
  });

  function setSpeed(level){
    tickMs = SPEEDS[level] ?? SPEEDS.mid;
    document.getElementById('speed').textContent = level === 'slow' ? '느림' : level === 'fast' ? '빠름' : '중';
    if (playing) { clearInterval(timer); timer = setInterval(tick, tickMs); }
  }

  function toggle(){ playing ? stop() : start(); }
  function start(){ if(isOver) { reset(); start(); } else if (!playing){ playing = true; timer = setInterval(tick, tickMs); } }
  function stop(){ playing = false; clearInterval(timer); }

  function rotateLeft(v){ return { x: -v.y, y: v.x }; }
  function rotateRight(v){ return { x: v.y, y: -v.x }; }

  // === 음식 배치 ===
  function placeFood(){
    while(true){
      const x = Math.floor(Math.random()*COLS);
      const y = Math.floor(Math.random()*ROWS);
      if (!snake.some(s=>s.x===x && s.y===y)) { food = {x,y}; break; }
    }
  }

  // === 게임 루프 ===
  function tick(){
    // 1) 회전 적용 (프레임당 한 번만)
    if (nextTurn !== 0){
      dir = nextTurn === -1 ? rotateLeft(dir) : rotateRight(dir);
      nextTurn = 0;
    }

    // 2) 머리 이동
    const head = snake[snake.length-1];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // 3) 벽 충돌 체크 (게임오버)
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      gameOver();
      return;
    }

    // 4) 몸 충돌 체크 (마지막 꼬리 제거 전에 확인)
    if (snake.some(seg => seg.x === nx && seg.y === ny)) {
      gameOver();
      return;
    }

    // 5) 새 머리 추가
    snake.push({x: nx, y: ny});

    // 6) 먹이 먹음 처리
    if (nx === food.x && ny === food.y) {
      grown += 1; // 한 칸 늘어나기
      score += 1;
      document.getElementById('score').textContent = score;
      placeFood();
    }

    // 7) 늘어나는 중이 아니면 꼬리 제거
    if (grown > 0) { grown -= 1; }
    else { snake.shift(); }

    draw();
  }

  function gameOver(){
    stop();
    isOver = true;
    draw();
    GRGScore.onGameEnd(score);
  }

  // === 렌더링 ===
  function draw(){
    // 배경
    ctx.fillStyle = '#0b0e1a';
    ctx.fillRect(0,0,W,H);

    // 그리드(연한 선)ㅁ
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#3a4064';
    for(let x=0; x<=COLS; x++){
      ctx.beginPath(); ctx.moveTo(x*CELL+0.5, 0); ctx.lineTo(x*CELL+0.5, H); ctx.stroke();
    }
    for(let y=0; y<=ROWS; y++){
      ctx.beginPath(); ctx.moveTo(0, y*CELL+0.5); ctx.lineTo(W, y*CELL+0.5); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 음식 (동그라미)
    drawCellCircle(food.x, food.y, '#ffd166');

    // SNAKE
    snake.forEach((seg, i) => {
      const isHead = i === snake.length-1;
      drawCellRect(seg.x, seg.y, isHead ? '#7aa2f7' : '#9aa8ff');
      if (isHead) drawEyes(seg.x, seg.y);
    });

    if (!playing){
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#e6e8ef';
      ctx.font = 'bold 24px system-ui,Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Space로 시작 / 일시정지', W/2, H/2 - 12);
      ctx.font = '14px system-ui,Segoe UI';
      ctx.fillText('좌/우: 회전  ·  R: 리셋', W/2, H/2 + 16);
      if (isOver) ctx.fillStyle = '#ff6b6b', ctx.fillText('게임 오버!', W/2, H/2 + 44);
    }
  }

  function drawCellRect(x, y, color){
    const px = x*CELL, py = y*CELL; const pad = 3;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(px+pad, py+pad, CELL-pad*2, CELL-pad*2, 6);
    ctx.fill();
  }

  function drawCellCircle(x, y, color){
    const cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL*0.32, 0, Math.PI*2);
    ctx.fill();
  }

  function drawEyes(x, y){
    const cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
    const ex = cx + dir.x * 6 - dir.y * 6;  // 방향에 따른 살짝 비틀린 눈 위치
    const ey = cy + dir.y * 6 + dir.x * 6;
    ctx.fillStyle = '#0b0e1a';
    ctx.beginPath(); ctx.arc(ex-4, ey-4, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+4, ey+4, 2.5, 0, Math.PI*2); ctx.fill();
  }

  // 시작
  reset();
  </script>
</body>
</html>
